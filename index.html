:root{
  --bg:        #f5f3ee;
  --surface:   #ffffff;
  --surface-2: #eae6dd;
  --ink:       #211f1c;
  --ink-soft:  #6b665d;
  --line:      rgba(33,31,28,0.12);
  --accent:    #3c6e63;
  --accent-2:  #a98f4b;
  --accent-soft: rgba(60,110,99,0.12);

  --display: "GenSenRounded TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  --body: "GenSenRounded TC", "PingFang TC", "Microsoft JhengHei", sans-serif;

  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:        #17181a;
    --surface:   #212224;
    --surface-2: #2a2b2d;
    --ink:       #ece9e2;
    --ink-soft:  #a7a39a;
    --line:      rgba(236,233,226,0.12);
    --accent:    #6fb3a3;
    --accent-2:  #d1b872;
    --accent-soft: rgba(111,179,163,0.16);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:        #17181a;
  --surface:   #212224;
  --surface-2: #2a2b2d;
  --ink:       #ece9e2;
  --ink-soft:  #a7a39a;
  --line:      rgba(236,233,226,0.12);
  --accent:    #6fb3a3;
  --accent-2:  #d1b872;
  --accent-soft: rgba(111,179,163,0.16);
}

*{box-sizing:border-box;}
[hidden]{display:none !important;}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--body);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
.corner-hex{
  position:fixed; top:-60px; right:-60px;
  width:260px; height:260px;
  opacity:0.5; z-index:0; pointer-events:none;
  color:var(--line);
}
@media (prefers-reduced-motion:no-preference){
  .stage{ animation: rise .4s ease both; }
  @keyframes rise{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }
}

.wrap{
  position:relative; z-index:1;
  max-width:560px; margin:0 auto;
  padding-top: 28px;
  padding-bottom: 40px;
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
  min-height:100svh;
  display:flex; flex-direction:column;
  gap:20px;
}

.eyebrow{
  font-family:var(--body); font-weight:700; font-size:14.5px;
  letter-spacing:0.14em; text-transform:uppercase;
  color:var(--accent);
  margin:0 0 10px;
}

/* ---------- start ---------- */
#start{
  margin:auto 0; text-align:center;
  position:relative; overflow:hidden;
  padding:40px 28px 32px;
  border-radius:28px;
  color:var(--ink);
  background:rgba(255,255,255,0.6);
  border:1px solid var(--line);
  box-shadow:0 30px 70px -36px rgba(33,31,28,0.18);
}
#start > *{ position:relative; z-index:1; }
#start .eyebrow{ color:var(--accent); }
#start h1{
  font-family:var(--display); font-weight:900;
  font-size:clamp(32px, 7.8vw, 44px);
  line-height:1.25; margin:12px 0 14px;
  text-wrap:balance; color:var(--ink);
}
#start p.lede{
  font-size:16.5px; line-height:1.7; color:var(--ink-soft);
  margin:0 auto 26px; max-width:44ch;
}
.type-chips{
  display:flex; flex-wrap:wrap; gap:8px; justify-content:center;
  margin-bottom:26px;
}

           cling:"會明顯不開心，需要對方多安撫幾句" } },
  { q:"妳覺得一段感情最理想的樣子是：",
    opts:{ watch:"慢慢來，確定彼此都合適再往前走", free:"兩人各自精彩，偶爾交疊出美好的時刻",
           steady:"平淡但穩定，一起把日子過好", flow:"保持新鮮感，不被關係綁得太緊",
           spark:"永遠心動、永遠有驚喜", allin:"全心投入，把彼此放在人生的第一順位",
           cling:"隨時都能感覺到彼此的存在，很有安全感" } }
];

/* ---------------- state ---------------- */
var current = 0;
var answers = []; // { x, y } per question, index-aligned with QUESTIONS
var shuffledOrders = []; // remembers shuffle per question for back-navigation

function shuffle(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t=a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}

/* ---------------- render: start ---------------- */
var chipsEl = document.getElementById("type-chips");
ORDER.forEach(function(key){
  var t = TYPES[key];
  chipsEl.insertAdjacentHTML("beforeend",
    '<span class="type-chip">'+iconSvg(key,15)+t.name+'</span>');
});

document.getElementById("start-btn").addEventListener("click", function(){
  logEvent("start");
  document.getElementById("start").hidden = true;
  document.getElementById("quiz").hidden = false;
  renderQuestion();
});

/* ---------------- render: quiz ---------------- */
var railFill = document.getElementById("rail-fill");
var railCount = document.getElementById("rail-count");
var qTitle = document.getElementById("q-title");
var qOptions = document.getElementById("q-options");
var backBtn = document.getElementById("back-btn");

backBtn.addEventListener("click", function(){
  if(current > 0){
    current--;
    renderQuestion();
  }
});

function renderQuestion(){
  var total = QUESTIONS.length;
  railFill.style.width = (current/total*100)+"%";
  railCount.textContent = (current+1)+" / "+total;
  backBtn.style.visibility = current===0 ? "hidden" : "visible";

  var item = QUESTIONS[current];
  qTitle.textContent = item.q;
  qOptions.innerHTML = "";

  var order = shuffledOrders[current];
  if(!order){
    order = shuffle(ORDER);
    shuffledOrders[current] = order;
  }

  order.forEach(function(key){
    var btn = document.createElement("button");
    btn.className = "option";
    btn.type = "button";
    btn.textContent = item.opts[key];
    btn.addEventListener("click", function(){
      answers[current] = { x: TYPES[key].x, y: TYPES[key].y, key: key };
      if(current < QUESTIONS.length - 1){
        current++;
        renderQuestion();
      } else {
        showResult();
      }
    });
    qOptions.appendChild(btn);
  });
}

/* ---------------- result ----------------
   Primary rule: whichever type's voice you picked most often wins —
   simple, transparent, and matches how people expect the result to be
   decided. Ties are broken by whichever type sits closest to your
   average pace/closeness coordinate. */
function showResult(){
  var counts = {}; ORDER.forEach(function(k){ counts[k] = 0; });
  var sumX=0, sumY=0, n=0;
  answers.forEach(function(a){
    if(a){ sumX+=a.x; sumY+=a.y; n++; counts[a.key]++; }
  });
  var avgX = n ? sumX/n : 5;
  var avgY = n ? sumY/n : 5;

  var bestKey = ORDER[0], bestCount = -1, bestDist = Infinity;
  ORDER.forEach(function(key){
    var t = TYPES[key];
    var c = counts[key];
    var d = Math.pow(t.x-avgX,2) + Math.pow(t.y-avgY,2);
    if(c > bestCount || (c === bestCount && d < bestDist)){
      bestCount = c; bestDist = d; bestKey = key;
    }
  });

  var t = TYPES[bestKey];
  document.getElementById("hero-icon").innerHTML = iconSvg(bestKey, 40);
  document.getElementById("r-name").textContent = t.name;
  document.getElementById("r-tagline").textContent = t.tagline;
  document.getElementById("r-desc").textContent = t.desc;
  document.getElementById("bar-x").style.width = (avgX/10*100)+"%";
  document.getElementById("bar-y").style.width = (avgY/10*100)+"%";
  document.getElementById("val-x").textContent = avgX.toFixed(1);
  document.getElementById("val-y").textContent = avgY.toFixed(1);

  document.getElementById("quiz").hidden = true;
  document.getElementById("result").hidden = false;

  logEvent("complete", bestKey);
}

document.getElementById("retake-btn").addEventListener("click", function(){
  current = 0;
  answers = [];
  shuffledOrders = [];
  document.getElementById("result").hidden = true;
  document.getElementById("start").hidden = false;
});

document.getElementById("copy-url-btn").addEventListener("click", function(){
  var msg = document.getElementById("url-msg");
  navigator.clipboard.writeText(location.href).then(function(){
    msg.textContent = "網址已複製";
    setTimeout(function(){ msg.textContent = ""; }, 2000);
  }).catch(function(){
    msg.textContent = "複製失敗，請手動複製網址";
  });
});

})();
</script>
